<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<title>Menú</title>
<style>
:root{--gold:#e7b75f;--gold2:#f6d894;--bg:#0b0907;--card:#17120d;--txt:#f7f1e8;--muted:#b9ad9c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.serif{font-family:Georgia,"Times New Roman",serif}

/* ---------- feed vertical ---------- */
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;perspective:900px}
#feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}

/* intro */
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at 50% 35%,#3a2412 0%,#140d08 55%,#050403 100%)}
.intro .flame{font-size:54px;animation:flick 1.6s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px #ff8a2a)}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12) rotate(3deg)}}
.intro h1{font-size:clamp(40px,12vw,64px);letter-spacing:2px;color:var(--gold2);margin-top:8px;
  text-shadow:0 2px 0 #7a5316,0 4px 0 #5a3c10,0 10px 24px rgba(0,0,0,.8);transform:rotateX(12deg)}
.intro .sub{letter-spacing:5px;text-transform:uppercase;font-size:13px;color:var(--gold);margin-top:6px}
.intro .info{color:var(--muted);font-size:13px;margin-top:18px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px;max-width:420px}
.chip{border:1px solid rgba(231,183,95,.45);background:rgba(231,183,95,.08);color:var(--txt);padding:9px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:var(--muted);font-size:13px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* producto */
.stage{position:absolute;inset:0;transform-origin:50% 60%;transition:transform .9s cubic-bezier(.2,.8,.2,1),filter .9s}
.slide:not(.on) .stage{transform:scale(1.18) rotateX(14deg) translateY(4%);filter:brightness(.55)}
.stage video{width:100%;height:100%;object-fit:cover;display:block}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;
  background:radial-gradient(circle at 50% 42%,#4a2c12,#0b0907 70%)}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.88) 100%)}
.cat{position:absolute;top:calc(64px + env(safe-area-inset-top));left:18px;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.info-box{position:absolute;left:18px;right:18px;bottom:calc(26px + env(safe-area-inset-bottom))}
.info-box > *{transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s}
.slide:not(.on) .info-box > *{transform:translateY(24px);opacity:0}
.slide.on .info-box > :nth-child(2){transition-delay:.08s}.slide.on .info-box > :nth-child(3){transition-delay:.16s}.slide.on .info-box > :nth-child(4){transition-delay:.24s}
.tag{display:inline-block;background:var(--gold);color:#241604;font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:5px 10px;border-radius:6px;margin-bottom:10px}
.name{font-size:clamp(28px,8vw,40px);line-height:1.05;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.desc{color:#e3d9ca;font-size:15px;margin-top:8px;line-height:1.4;max-width:460px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.price{font-size:clamp(30px,9vw,42px);font-weight:800;color:var(--gold2);
  text-shadow:0 2px 0 #7a5316,0 6px 20px rgba(0,0,0,.8);transform:perspective(400px) rotateX(10deg)}
.btn{border:0;cursor:pointer;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241604;font-weight:800;font-size:15px;
  padding:14px 20px;border-radius:14px;box-shadow:0 6px 0 #8a5d17,0 12px 24px rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a5d17,0 6px 12px rgba(0,0,0,.5)}

/* barra superior */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;pointer-events:none}
.top > *{pointer-events:auto}
.brand{font-size:18px;color:var(--gold2);text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:0;transition:opacity .4s}
.top.show .brand{opacity:1}
.carta-btn{background:rgba(20,14,9,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(231,183,95,.4);
  color:var(--txt);font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer}
.dots{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:7px}
.dots i{width:5px;height:5px;border-radius:9px;background:rgba(255,255,255,.35);transition:all .3s}
.dots i.on{height:18px;background:var(--gold)}

/* carta completa */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:88dvh;overflow-y:auto;background:var(--card);
  border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);
  max-width:640px;margin:0 auto;border-top:1px solid rgba(231,183,95,.3)}
.open .sheet{transform:none}.open .sheet-bg{opacity:1;pointer-events:auto}
.grab{width:42px;height:5px;border-radius:9px;background:#4a3d2e;margin:0 auto 12px}
.sheet h2{font-size:24px;color:var(--gold2);text-align:center}
.sheet h3{font-size:16px;color:var(--gold);margin:22px 0 6px;letter-spacing:.5px}
.it{display:flex;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.it .l{flex:1;min-width:0}.it b{font-weight:600}.it small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.it .pp{color:var(--gold2);font-weight:700;white-space:nowrap}
.it .play{font-size:11px;color:#241604;background:var(--gold);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px;white-space:nowrap;display:inline-block}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div class="top" id="top"><div class="brand serif" id="brand"></div><button class="carta-btn" id="cartaBtn">📋 Carta completa</button></div>
<div class="dots" id="dots"></div>
<main id="feed"></main>
<div id="sheetWrap"><div class="sheet-bg" id="sheetBg"></div><div class="sheet" id="sheet"></div></div>

<script>
(function(){
  var c=(new URLSearchParams(location.search).get('c')||'demo').replace(/[^a-z0-9_-]/gi,'');
  if(window.MENU){start();return;}
  var s=document.createElement('script');s.src='menu-'+c+'.js?v='+Date.now();
  s.onload=start;s.onerror=function(){document.body.innerHTML='<p style="padding:40px;text-align:center">Menú no encontrado</p>'};
  document.head.appendChild(s);
})();

function fmt(n){return MENU.moneda+Number(n).toLocaleString('es-AR')}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function emoji(cat){var m=cat.match(/^\S+/);return m&&!/[a-z]/i.test(m[0])?m[0]:'🍽️'}
function catName(cat){return cat.replace(/^\S+\s/,'')}
function pedir(n,p){
  if(!MENU.whatsapp)return;
  var t=(MENU.mensaje||'Hola! Quiero pedir:')+' '+n+' ('+fmt(p)+')';
  window.open('https://wa.me/'+MENU.whatsapp+'?text='+encodeURIComponent(t),'_blank');
}

function start(){
  document.title=MENU.nombre+' · Menú';
  document.getElementById('brand').textContent=MENU.nombre;
  var feed=document.getElementById('feed'),html='',firstOfCat={},idx=1;

  // portada
  html+='<section class="slide intro on"><div class="flame">🔥</div><h1 class="serif">'+esc(MENU.nombre)+'</h1>'+
    '<div class="sub">'+esc(MENU.subtitulo||'')+'</div>'+
    '<div class="info">'+esc(MENU.direccion||'')+(MENU.horario?'<br>'+esc(MENU.horario):'')+'</div><div class="chips">';
  MENU.categorias.forEach(function(cat,ci){html+='<button class="chip" data-cat="'+ci+'">'+esc(cat.nombre)+'</button>'});
  html+='</div><div class="hint">Deslizá hacia arriba ↑ para ver los platos</div></section>';

  // un slide por producto con video
  MENU.categorias.forEach(function(cat,ci){
    cat.items.forEach(function(it){
      if(!it.v)return;
      if(firstOfCat[ci]==null)firstOfCat[ci]=idx;
      html+='<section class="slide prod" data-n="'+esc(it.n)+'" data-p="'+it.p+'"><div class="stage">'+
        '<div class="fallback">'+emoji(cat.nombre)+'</div>'+
        '<video muted loop playsinline preload="none" data-src="'+esc(it.v)+'"></video></div><div class="shade"></div>'+
        '<div class="cat">'+esc(catName(cat.nombre))+'</div><div class="info-box">'+
        (it.tag?'<div><span class="tag">'+esc(it.tag)+'</span></div>':'<div></div>')+
        '<h2 class="name serif">'+esc(it.n)+'</h2>'+(it.d?'<p class="desc">'+esc(it.d)+'</p>':'<p></p>')+
        '<div class="row"><div class="price">'+fmt(it.p)+'</div>'+(MENU.whatsapp?'<button class="btn pedir">Pedir 🛎️</button>':'')+'</div></div></section>';
      idx++;
    });
  });

  // cierre
  html+='<section class="slide intro"><div class="flame">📋</div><h1 class="serif" style="font-size:36px">¿Algo más?</h1>'+
    '<div class="info">Mirá la carta completa con todos los platos y precios.</div>'+
    '<div class="chips"><button class="chip" id="cartaEnd">📋 Ver carta completa</button></div></section>';
  feed.innerHTML=html;

  // carta completa
  var sh='<div class="grab"></div><h2 class="serif">'+esc(MENU.nombre)+'</h2>';
  MENU.categorias.forEach(function(cat,ci){
    sh+='<h3>'+esc(cat.nombre)+'</h3>';
    cat.items.forEach(function(it){
      sh+='<div class="it" data-n="'+esc(it.n)+'" data-p="'+it.p+'"'+(it.v?' data-go="'+esc(it.n)+'"':'')+'><div class="l"><b>'+esc(it.n)+'</b>'+
        (it.v?'<span class="play">▶ video</span>':'')+(it.d?'<small>'+esc(it.d)+'</small>':'')+'</div><div class="pp">'+fmt(it.p)+'</div></div>';
    });
  });
  sh+='<div class="foot">Tocá un plato para pedirlo · Menú digital por Lyvora</div>';
  document.getElementById('sheet').innerHTML=sh;

  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var dots=document.getElementById('dots');
  dots.innerHTML=slides.map(function(){return '<i></i>'}).join('');
  var dotEls=dots.children;

  function load(sl){var v=sl.querySelector('video');if(v&&!v.src){v.src=v.dataset.src;v.addEventListener('loadeddata',function(){sl.querySelector('.fallback').style.display='none'})}return v}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      var sl=e.target,i=slides.indexOf(sl),v;
      if(e.isIntersecting){
        sl.classList.add('on');dotEls[i].classList.add('on');
        document.getElementById('top').classList.toggle('show',i>0);
        v=load(sl);if(v){v.currentTime=0;var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}
        if(slides[i+1])load(slides[i+1]);
      }else{
        sl.classList.remove('on');dotEls[i].classList.remove('on');
        v=sl.querySelector('video');if(v)v.pause();
      }
    });
  },{threshold:.6});
  slides.forEach(function(s){io.observe(s)});

  function goTo(i){slides[i]&&slides[i].scrollIntoView({behavior:'smooth'})}
  var wrap=document.getElementById('sheetWrap');
  function openSheet(){wrap.classList.add('open')}
  function closeSheet(){wrap.classList.remove('open')}

  document.addEventListener('click',function(e){
    var t=e.target;
    if(t.closest('.chip[data-cat]')){
      var ci=+t.closest('.chip').dataset.cat;
      if(firstOfCat[ci]!=null)goTo(firstOfCat[ci]);else openSheet();
      return;
    }
    if(t.id==='cartaBtn'||t.id==='cartaEnd'){openSheet();return}
    if(t.id==='sheetBg'){closeSheet();return}
    if(t.closest('.pedir')){var s=t.closest('.slide');pedir(s.dataset.n,s.dataset.p);return}
    var it=t.closest('.it');
    if(it){
      if(it.dataset.go){closeSheet();var k=slides.findIndex(function(s){return s.dataset.n===it.dataset.go});goTo(k)}
      else pedir(it.dataset.n,it.dataset.p);
    }
  });
}
</script>
</body>
</html>
