<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú</title>
<style>
  :root{--bg:#faf7f2;--card:#fff;--ink:#2a2118;--muted:#8a7d70;--line:#ece4d9;--accent:#c2410c;--accent-soft:#fff1e8}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:28px 20px 22px;text-align:center}
  header h1{margin:0;font-size:26px;letter-spacing:.3px}
  header p{margin:6px 0 0;opacity:.8;font-size:14px}
  .info{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-top:12px;font-size:13px;opacity:.85}
  nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600}
  nav a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{max-width:640px;margin:0 auto;padding:6px 14px 110px}
  section{scroll-margin-top:60px}
  h2{font-size:18px;margin:22px 4px 10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
  .item b{display:block;font-size:15px}
  .item small{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.35}
  .price{font-weight:800;white-space:nowrap;color:var(--accent)}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}
  .wa{position:fixed;left:14px;right:14px;bottom:14px;max-width:612px;margin:0 auto;display:block;text-align:center;background:#25D366;color:#fff;text-decoration:none;font-weight:800;padding:15px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:16px}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 0 0}
  footer a{color:var(--muted)}
  .err{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><p class="err">Cargando menú…</p></div>
<script>
(function(){
  var c=(new URLSearchParams(location.search).get('c')||'demo').toLowerCase().replace(/[^a-z0-9-]/g,'');
  var s=document.createElement('script'); s.src='menu-'+c+'.js?v='+Date.now();
  s.onerror=function(){document.getElementById('app').innerHTML='<p class="err">Menú no encontrado.</p>'};
  s.onload=render; document.head.appendChild(s);
  function e(t){return String(t==null?'':t).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
  function money(p){return (window.MENU.moneda||'$')+' '+Number(p).toLocaleString('es-AR')}
  function render(){
    var M=window.MENU; if(!M){return s.onerror()}
    document.title=M.nombre+' · Menú';
    var h='<header><h1>'+e(M.nombre)+'</h1>'+(M.subtitulo?'<p>'+e(M.subtitulo)+'</p>':'')+
      '<div class="info">'+(M.direccion?'<span>📍 '+e(M.direccion)+'</span>':'')+(M.horario?'<span>🕒 '+e(M.horario)+'</span>':'')+'</div></header>';
    h+='<nav>'+M.categorias.map(function(k,i){return '<a href="#k'+i+'"'+(i==0?' class="on"':'')+'>'+e(k.nombre)+'</a>'}).join('')+'</nav><main>';
    M.categorias.forEach(function(k,i){
      h+='<section id="k'+i+'"><h2>'+e(k.nombre)+'</h2>'+k.items.map(function(it){
        return '<div class="item"><div><b>'+e(it.n)+(it.tag?'<span class="tag">'+e(it.tag)+'</span>':'')+'</b>'+(it.d?'<small>'+e(it.d)+'</small>':'')+'</div><div class="price">'+money(it.p)+'</div></div>'}).join('')+'</section>';
    });
    if(M.credito!==false) h+='<footer>Menú digital hecho por <a href="https://wa.me/5493741442771?text='+encodeURIComponent('Hola! Vi un menú digital de Lyvora y quiero uno para mi negocio')+'">Lyvora</a></footer>';
    h+='</main>';
    if(M.whatsapp) h+='<a class="wa" href="https://wa.me/'+e(M.whatsapp)+'?text='+encodeURIComponent(M.mensaje||'Hola! Quiero hacer un pedido')+'">💬 Pedir por WhatsApp</a>';
    document.getElementById('app').innerHTML=h;
    var links=[].slice.call(document.querySelectorAll('nav a')), secs=[].slice.call(document.querySelectorAll('section'));
    addEventListener('scroll',function(){var y=scrollY+80,idx=0;secs.forEach(function(sc,i){if(sc.offsetTop<=y)idx=i});links.forEach(function(a,i){a.classList.toggle('on',i==idx)})},{passive:true});
  }
})();
</script>
</body>
</html>
